<article class="flex justify-between items-center bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 shadow-xs hover:shadow-md rounded-xl p-5 w-full h-full transition group">
  <div class="flex flex-col min-w-0">
    <span class="text-xs font-bold uppercase tracking-wider text-slate-400 dark:text-slate-500 truncate mb-1">
      {{ label }}
    </span>
    <p class="text-3xl sm:text-4xl font-extrabold text-slate-900 dark:text-slate-100 tracking-tight">
      {{ value }}
    </p>
    <span class="text-[11px] font-medium text-slate-400 dark:text-slate-500 mt-1 flex items-center gap-1">
      <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
      Registros últimos 7 días
    </span>
  </div>

  <div class="w-12 h-12 rounded-xl bg-blue-50 dark:bg-blue-950/50 text-blue-600 dark:text-blue-400 flex items-center justify-center flex-shrink-0 group-hover:scale-105 transition-transform border border-blue-100 dark:border-blue-900/30 shadow-xs">
    <span class="material-symbols-outlined text-2xl">{{ icon }}</span>
  </div>
</article>
