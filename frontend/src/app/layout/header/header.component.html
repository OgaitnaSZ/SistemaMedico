<header class="h-16 border-b border-slate-200/80 dark:border-slate-800 bg-white/80 dark:bg-slate-900/80 backdrop-blur-md px-4 sm:px-6 flex items-center justify-between sticky top-0 z-30 transition-colors">
  <!-- Título y Subtítulo de la Pantalla Actual -->
  <div class="flex items-center gap-3 min-w-0">
    <div>
      <h2 class="text-base sm:text-lg font-bold text-slate-800 dark:text-slate-100 tracking-tight leading-tight truncate">
        {{ tituloSeccion }}
      </h2>
      <p class="hidden sm:block text-xs text-slate-400 dark:text-slate-500 truncate">
        {{ subtituloSeccion }}
      </p>
    </div>
  </div>

  <!-- Herramientas y Perfil del Médico -->
  <div class="flex items-center gap-2 sm:gap-4 flex-shrink-0">
    <!-- Fecha Actual -->
    <div class="hidden lg:flex items-center gap-1.5 px-3 py-1.5 rounded-lg bg-slate-50 dark:bg-slate-800/60 border border-slate-200/60 dark:border-slate-700/60 text-xs font-medium text-slate-600 dark:text-slate-300">
      <span class="material-symbols-outlined text-sm text-blue-600 dark:text-blue-400">calendar_today</span>
      <span>{{ fechaActual }}</span>
    </div>

    <!-- Toggle de Tema (Claro / Oscuro) -->
    <button
      (click)="toggleTheme()"
      [attr.aria-label]="isDark ? 'Cambiar a modo claro' : 'Cambiar a modo oscuro'"
      title="Alternar tema claro/oscuro"
      class="w-9 h-9 rounded-lg flex items-center justify-center text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-100 bg-slate-50 hover:bg-slate-100 dark:bg-slate-800/60 dark:hover:bg-slate-800 border border-slate-200/60 dark:border-slate-700/60 transition"
    >
      <span class="material-symbols-outlined text-lg">
        {{ isDark ? 'light_mode' : 'dark_mode' }}
      </span>
    </button>

    <div class="h-6 w-[1px] bg-slate-200 dark:bg-slate-800 hidden sm:block"></div>

    <!-- Perfil del Médico -->
    <a
      routerLink="/configuracion"
      class="flex items-center gap-2.5 p-1 sm:px-2.5 sm:py-1.5 rounded-lg hover:bg-slate-50 dark:hover:bg-slate-800/60 transition group border border-transparent hover:border-slate-200/60 dark:hover:border-slate-700/60"
      title="Ver perfil y configuración"
    >
      <div class="w-8 h-8 rounded-full bg-gradient-to-tr from-blue-600 to-sky-500 text-white flex items-center justify-center font-bold text-xs shadow-xs">
        {{ getIniciales(nombreDoctor) }}
      </div>
      <div class="hidden md:block text-left">
        <p class="text-xs font-bold text-slate-800 dark:text-slate-200 leading-tight group-hover:text-blue-600 dark:group-hover:text-blue-400 transition">
          Dr. {{ nombreDoctor }}
        </p>
        <span class="text-[10px] font-medium text-emerald-600 dark:text-emerald-400 flex items-center gap-1">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
          Médico Titular
        </span>
      </div>
    </a>
  </div>
</header>
