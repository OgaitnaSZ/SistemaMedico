<div class="space-y-6">
  <!-- Navegación y Encabezado del Perfil -->
  <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
    <div>
      <!-- Breadcrumb -->
      <nav class="flex items-center gap-2 text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">
        <a routerLink="/pacientes" class="inline-flex items-center gap-1 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
          <span class="material-symbols-outlined text-sm">arrow_back</span>
          <span>Pacientes</span>
        </a>
        <span>/</span>
        <span class="text-slate-800 dark:text-slate-200 font-semibold">
          {{ paciente.nombre ? (paciente.apellido + ', ' + paciente.nombre) : 'Ficha del Paciente' }}
        </span>
      </nav>

      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
        Ficha Clínica del Paciente
      </h1>
    </div>

    <!-- Botones de Acción -->
    @if (paciente.dni != '') {
      <div class="flex items-center gap-2">
        <a
          [routerLink]="['/pacientes/modificar-paciente', idPaciente]"
          class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-slate-700 dark:text-slate-200 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:bg-slate-50 dark:hover:bg-slate-700/60 rounded-xl shadow-sm transition-all"
        >
          <span class="material-symbols-outlined text-base text-amber-500">edit</span>
          <span>Modificar Datos</span>
        </a>
        <button
          type="button"
          (click)="eliminarPaciente()"
          class="inline-flex items-center gap-1.5 px-3.5 py-2 text-xs font-semibold text-rose-700 dark:text-rose-400 bg-rose-50 dark:bg-rose-950/40 border border-rose-200/80 dark:border-rose-900/50 hover:bg-rose-100 dark:hover:bg-rose-900/60 rounded-xl transition-all"
        >
          <span class="material-symbols-outlined text-base">delete</span>
          <span>Eliminar</span>
        </button>
      </div>
    }
  </div>

  @if (paciente.dni != '') {
    <!-- Tarjeta: Datos Demográficos y de Contacto -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl shadow-sm p-5 sm:p-7">
      <app-datos-paciente [paciente]="paciente"></app-datos-paciente>
    </div>

    <!-- Tarjeta: Historia Clínica y Consultas -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-2xl shadow-sm p-5 sm:p-7">
      @if (idPaciente != '') {
        <app-historia-clinica [idPaciente]="idPaciente"></app-historia-clinica>
      }
    </div>
  }
</div>
