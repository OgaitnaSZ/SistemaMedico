<div class="space-y-6">
  <!-- Navegación Superior y Selector de Modo -->
  <div class="flex flex-col md:flex-row md:items-center justify-between gap-4">
    <div>
      <nav class="flex items-center gap-2 text-xs font-medium text-slate-500 dark:text-slate-400 mb-2">
        <a routerLink="/pacientes" class="inline-flex items-center gap-1 hover:text-blue-600 dark:hover:text-blue-400 transition-colors">
          <span class="material-symbols-outlined text-sm">arrow_back</span>
          <span>Pacientes</span>
        </a>
        <span>/</span>
        <span class="text-slate-800 dark:text-slate-200 font-semibold">
          Alta de Pacientes
        </span>
      </nav>

      <h1 class="text-2xl sm:text-3xl font-bold tracking-tight text-slate-900 dark:text-white">
        Incorporación de Pacientes
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400 mt-0.5">
        Elija si desea cargar un paciente manualmente o importar una nómina completa en Excel (.xlsx / .xls)
      </p>
    </div>

    <!-- Pestañas Grandes y Claras -->
    <div class="inline-flex p-1.5 bg-slate-100 dark:bg-slate-800/80 rounded-2xl border border-slate-200/80 dark:border-slate-700 shadow-sm shrink-0 self-start md:self-auto">
      <button
        type="button"
        (click)="cambiarPestana('individual')"
        [ngClass]="{
          'bg-white dark:bg-slate-900 text-blue-600 dark:text-blue-400 shadow-sm font-bold': pestanaActiva === 'individual',
          'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 font-medium': pestanaActiva !== 'individual'
        }"
        class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm transition-all duration-150 cursor-pointer"
      >
        <span class="material-symbols-outlined text-lg">person_add</span>
        <span>Carga Individual</span>
      </button>

      <button
        type="button"
        (click)="cambiarPestana('importar')"
        [ngClass]="{
          'bg-emerald-600 text-white shadow-sm font-bold': pestanaActiva === 'importar',
          'text-slate-600 dark:text-slate-400 hover:text-slate-900 dark:hover:text-slate-100 font-medium': pestanaActiva !== 'importar'
        }"
        class="inline-flex items-center gap-2 px-4 py-2.5 rounded-xl text-xs sm:text-sm transition-all duration-150 cursor-pointer"
      >
        <span class="material-symbols-outlined text-lg">upload_file</span>
        <span>Importar Excel (.xlsx)</span>
      </button>
    </div>
  </div>

  <!-- Vista Condicional -->
  @if (pestanaActiva === 'individual') {
    <app-form-pacientes></app-form-pacientes>
  } @else {
    <app-importar-pacientes></app-importar-pacientes>
  }
</div>
