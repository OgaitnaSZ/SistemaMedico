<div class="min-h-screen flex items-center justify-center p-4 sm:p-6 bg-slate-100 dark:bg-slate-950 transition-colors duration-200">
  <div class="w-full max-w-md">
    <!-- Tarjeta Principal de Login -->
    <div class="bg-white dark:bg-slate-900 border border-slate-200/80 dark:border-slate-800 rounded-3xl shadow-xl p-7 sm:p-9 space-y-7">
      <!-- Logotipo y Encabezado Clínico -->
      <div class="text-center space-y-2">
        <div class="inline-flex items-center justify-center w-14 h-14 rounded-2xl bg-gradient-to-br from-blue-600 to-indigo-600 text-white shadow-lg shadow-blue-500/25 mb-1">
          <span class="material-symbols-outlined text-3xl font-variation-settings-fill">health_and_safety</span>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-slate-900 dark:text-white">
          Sistema Médico
        </h1>
        <p class="text-xs sm:text-sm text-slate-500 dark:text-slate-400">
          Portal de Gestión Clínica & Historias Digitales
        </p>
      </div>

      <!-- Formulario de Autenticación -->
      <form (ngSubmit)="onLogin()" class="space-y-4">
        <!-- Campo: Usuario -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">
            Usuario del Sistema
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none">
              badge
            </span>
            <input
              type="text"
              name="usuario"
              [(ngModel)]="user"
              placeholder="Ej: drjperez"
              autocomplete="username"
              required
              class="w-full pl-10 pr-4 py-2.5 bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-sm"
            />
          </div>
        </div>

        <!-- Campo: Contraseña -->
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-700 dark:text-slate-300 mb-1.5">
            Contraseña
          </label>
          <div class="relative">
            <span class="material-symbols-outlined absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400 text-lg pointer-events-none">
              lock
            </span>
            <input
              [type]="mostrarPassword ? 'text' : 'password'"
              name="password"
              [(ngModel)]="pass"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              class="w-full pl-10 pr-11 py-2.5 bg-white dark:bg-slate-800/80 border border-slate-200 dark:border-slate-700 rounded-xl text-sm text-slate-900 dark:text-slate-100 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-blue-500/20 focus:border-blue-500 transition-all shadow-sm"
            />
            <button
              type="button"
              (click)="mostrarPassword = !mostrarPassword"
              class="absolute right-3 top-1/2 -translate-y-1/2 text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 p-1 rounded-lg transition-colors"
              title="{{ mostrarPassword ? 'Ocultar contraseña' : 'Ver contraseña' }}"
            >
              <span class="material-symbols-outlined text-lg">
                {{ mostrarPassword ? 'visibility_off' : 'visibility' }}
              </span>
            </button>
          </div>
        </div>

        <!-- Botón de Ingreso -->
        <div class="pt-2">
          <button
            type="submit"
            [disabled]="cargando"
            class="w-full inline-flex items-center justify-center gap-2 px-5 py-3 bg-blue-600 hover:bg-blue-700 active:bg-blue-800 disabled:opacity-60 text-white font-semibold text-sm rounded-xl shadow-md shadow-blue-500/20 hover:shadow-lg transition-all duration-150"
          >
            @if (cargando) {
              <div class="w-4 h-4 border-2 border-white/30 border-t-white rounded-full animate-spin"></div>
              <span>Verificando credenciales...</span>
            } @else {
              <span class="material-symbols-outlined text-lg">login</span>
              <span>Acceder al Sistema</span>
            }
          </button>
        </div>
      </form>

      <!-- Pie de Seguridad y Cumplimiento -->
      <div class="pt-4 border-t border-slate-100 dark:border-slate-800 text-center space-y-1">
        <div class="flex items-center justify-center gap-1.5 text-[11px] font-medium text-slate-400 dark:text-slate-500">
          <span class="material-symbols-outlined text-xs text-emerald-500">verified_user</span>
          <span>Acceso seguro • Cifrado de extremo a extremo</span>
        </div>
        <p class="text-[10px] text-slate-400 dark:text-slate-500">
          Exclusivo para profesionales médicos autorizados
        </p>
      </div>
    </div>
  </div>
</div>
